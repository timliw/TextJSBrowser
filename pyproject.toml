[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbr-text-browser"
version = "1.0.0"
description = "A terminal text-mode web browser (lynx/w3m-style) with a real JavaScript engine for Cloudflare-protected sites."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "camoufox",
    "beautifulsoup4",
    "requests",
    "lxml",
]

[project.scripts]
tbr = "tbr:main"
tbrowse = "browse:main"

[tool.setuptools]
py-modules = ["tbr", "browse", "session", "nav", "extract", "paths"]
